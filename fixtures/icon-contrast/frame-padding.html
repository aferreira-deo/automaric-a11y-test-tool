<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>icon-contrast: frame-padding</title>
    <style>
      body { margin: 32px; font: 16px/1.5 Arial, Helvetica, sans-serif; background: #fff; color: #1a1a1a; }
      .row { margin: 0 0 32px; }
      iframe { display: block; margin: 0 0 24px; }
      /* The content of a frame starts after its border and its padding. */
      #padded { padding: 40px; border: 4px solid #595959; }
      /* On screen this frame is three quarters of its layout size. */
      #scaled { border: 0; transform: scale(0.75); transform-origin: 0 0; }
      .turned { rotate: 2deg; width: 320px; }
      .turned iframe { border: 0; }
    </style>
  </head>
  <body>
    <iframe id="padded" src="frame-padding-child.html" title="Padded" width="300" height="140"></iframe>
    <iframe id="scaled" src="frame-padding-child.html" title="Scaled" width="300" height="140"></iframe>
    <div class="turned"><iframe id="in-turned" src="frame-padding-child.html" title="Inside a rotated box" width="300" height="140"></iframe></div>
  </body>
</html>
