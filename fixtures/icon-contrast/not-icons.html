<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>icon-contrast: not-icons</title>
    <style>
      body { margin: 32px; font: 16px/1.5 Arial, Helvetica, sans-serif; background: #fff; color: #1a1a1a; }
      .row { margin: 0 0 32px; }
      .icon { display: inline-flex; align-items: center; gap: 6px; padding: 8px; background: #fff; border: 1px solid #595959; border-radius: 4px; color: #1a1a1a; font: inherit; }
      svg, img { display: block; }
      .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      .card { position: relative; width: 240px; padding: 16px; border: 1px solid #595959; }
      .stretched::after { content: ""; position: absolute; inset: 0; }
      .badge::before { content: "New"; color: #c0c0c0; }
    </style>
  </head>
  <body>
    <!-- Controls with visible text: the icon is not what identifies them. No finding at all. -->
    <p class="row">
      <button id="text-and-icon" class="icon"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="#c0c0c0" d="M3 5h18v3H3zM3 10.5h18v3H3zM3 16h18v3H3z" /></svg> Menu</button>
      <button id="times-text" class="icon" style="color: #c0c0c0" aria-label="Close">&times;</button>
      <button id="pseudo-text" class="icon badge"></button>
      <input id="submit-default" type="submit" />
    </p>
    <!-- Not graphics, or not icons. No finding at all. -->
    <div class="row card">
      <a id="stretched" class="stretched" href="#top" aria-label="Open the card"></a>
      A card with a stretched link.
    </div>
    <p class="row">
      <a id="empty-link" href="#top"></a>
      <a id="photo-link" href="#top"><img alt="A large picture" width="300" height="120" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 120'%3E%3Cpath fill='%23f2f2f2' d='M0 0h300v120H0z'/%3E%3Cpath fill='%23e0e0e0' d='M0 80l80-50 70 40 60-30 90 60v20H0z'/%3E%3C/svg%3E" /></a>
      <button id="hidden-button" class="icon" style="display: none; color: #c0c0c0" aria-label="Menu"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 5h18v3H3zM3 10.5h18v3H3zM3 16h18v3H3z" /></svg></button>
    </p>
    <!-- Icons that are fine. -->
    <p class="row">
      <button id="sr-only-text" class="icon"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 5h18v3H3zM3 10.5h18v3H3zM3 16h18v3H3z" /></svg><span class="sr-only">Menu</span></button>
      <!-- A blue tile (#0b5fff, 5:1 on white) with a white glyph cut out of it. -->
      <a id="tile" href="#top" style="display: inline-block; padding: 6px" aria-label="Share"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6" fill="#0b5fff" /><path fill="#fff" d="M14 8h4v6h6v4h-6v6h-4v-6H8v-4h6z" /></svg></a>
    </p>
  </body>
</html>
