<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>icon-contrast: disabled</title>
    <style>
      body { margin: 32px; font: 16px/1.5 Arial, Helvetica, sans-serif; background: #fff; color: #1a1a1a; }
      .row { margin: 0 0 32px; }
      .icon { display: inline-flex; padding: 8px; background: #fff; border: 1px solid #d0d0d0; border-radius: 4px; color: #c0c0c0; }
      svg { display: block; }
      fieldset { border: 0; padding: 0; margin: 0; display: inline; }
      input[type="text"] { font: inherit; padding: 6px 8px; border: 1px solid #ddd; background: #fff; }
      .box { display: inline-block; width: 18px; height: 18px; border: 1px solid #ddd; vertical-align: middle; }
    </style>
  </head>
  <body>
    <!-- Every control here is low in contrast and disabled: exempt from 1.4.11, recorded as inventory. -->
    <p class="row">
      <button id="disabled-button" class="icon" disabled aria-label="Menu"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 5h18v3H3zM3 10.5h18v3H3zM3 16h18v3H3z" /></svg></button>
      <span id="aria-disabled" class="icon" role="button" aria-disabled="true" aria-label="Menu"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 5h18v3H3zM3 10.5h18v3H3zM3 16h18v3H3z" /></svg></span>
      <fieldset disabled><button id="in-disabled-fieldset" class="icon" aria-label="Menu"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 5h18v3H3zM3 10.5h18v3H3zM3 16h18v3H3z" /></svg></button></fieldset>
    </p>
    <p class="row">
      <label for="disabled-input">Name</label> <input id="disabled-input" type="text" disabled />
      <span id="disabled-checkbox" class="box" role="checkbox" aria-checked="false" aria-disabled="true" aria-label="Subscribe"></span>
    </p>
  </body>
</html>
