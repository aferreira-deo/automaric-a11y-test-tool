<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>icon-contrast: icon-font</title>
    <style>
      /* Generated by assets/make-font.mjs: U+E001 is a plus sign, U+E002 a square. */
      @font-face { font-family: "Fixture Icons"; src: url("assets/fixture-icons.ttf") format("truetype"); }
      body { margin: 32px; font: 16px/1.5 Arial, Helvetica, sans-serif; background: #fff; color: #1a1a1a; }
      .row { margin: 0 0 32px; }
      .icon { display: inline-flex; padding: 8px; background: #fff; border: 1px solid #595959; border-radius: 4px; color: #1a1a1a; }
      .fi::before { content: "\e001"; font: 20px/1 "Fixture Icons"; }
      .glyph { font: 20px/1 "Fixture Icons"; }
    </style>
  </head>
  <body>
    <p class="row">
      <button id="low" class="icon fi" style="color: #c0c0c0" aria-label="Add"></button>
      <button id="good" class="icon fi" aria-label="Add"></button>
      <button id="near" class="icon fi" style="color: #999" aria-label="Add"></button>
    </p>
    <p class="row">
      <!-- The glyph as a character of the Private Use Area in a text node. -->
      <button id="text-node-low" class="icon" style="color: #c0c0c0" aria-label="Stop"><span class="glyph" aria-hidden="true">&#xE002;</span></button>
      <button id="text-node-good" class="icon" aria-label="Stop"><span class="glyph" aria-hidden="true">&#xE002;</span></button>
    </p>
  </body>
</html>
