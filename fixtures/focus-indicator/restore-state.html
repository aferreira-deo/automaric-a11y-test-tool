<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>focus-indicator: restore-state</title>
    <style>
      body { margin: 32px; font: 16px/1.5 Arial, Helvetica, sans-serif; background: #fff; color: #1a1a1a; }
      .row { margin: 0 0 48px; }
      button, .btn { font: inherit; padding: 8px 16px; background: #fff; color: #1a1a1a; border: 1px solid #595959; border-radius: 4px; }
      a { color: #0645ad; }
      .good:focus-visible { outline: 2px solid #005fcc; outline-offset: 2px; }
      .scroller { height: 100px; overflow: auto; border: 1px solid #595959; margin: 0 0 24px; }
      .gap { height: 300px; }
      .spacer { height: 2000px; }
      input { font: inherit; padding: 6px 8px; border: 1px solid #595959; }
      iframe { display: block; border: 1px solid #595959; margin: 0 0 24px; }
    </style>
  </head>
  <body>
    <div id="scroller" class="scroller"><div class="gap"></div><button id="inner" class="good">In a scroller</button><div class="gap"></div></div>
    <div id="prescrolled" class="scroller"><div class="gap"></div><button id="deep" class="good">In a scrolled scroller</button><div class="gap"></div></div>
    <p class="row"><label for="field">Name</label> <input id="field" class="good" type="text" /></p>
    <iframe id="frame" src="restore-state-child.html" title="Same-origin document" width="300" height="100"></iframe>
    <iframe id="opaque" sandbox src="opaque-frame-long-child.html" title="Cross-origin document" width="300" height="100"></iframe>
    <p class="row"><button id="last" class="good">Last</button></p>
    <div class="spacer"></div>
  </body>
</html>
