<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>focus-indicator: inner-indicator</title>
    <style>
      body { margin: 32px; font: 16px/1.5 Arial, Helvetica, sans-serif; background: #fff; color: #1a1a1a; }
      .row { margin: 0 0 48px; }
      button, .btn { font: inherit; padding: 8px 16px; background: #fff; color: #1a1a1a; border: 1px solid #595959; border-radius: 4px; }
      a { color: #0645ad; }
      .good:focus-visible { outline: 2px solid #005fcc; outline-offset: 2px; }
      #inset-outline { background: #1a1a1a; color: #fff; border: 0; padding: 12px 20px; }
      #inset-outline:focus-visible { outline: 2px solid #fff; outline-offset: -5px; }
      #inset-shadow { background: #0b0c0c; color: #fff; border: 0; padding: 12px 20px; }
      #inset-shadow:focus-visible { outline: none; box-shadow: inset 0 0 0 3px #ffbf47; }
    </style>
  </head>
  <body>
    <p class="row"><button id="inset-outline">Save</button></p>
    <p class="row"><button id="inset-shadow">Cancel</button></p>
  </body>
</html>
