<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>focus-indicator: low-contrast-outline</title>
    <style>
      body { margin: 32px; font: 16px/1.5 Arial, Helvetica, sans-serif; background: #fff; color: #1a1a1a; }
      .row { margin: 0 0 48px; }
      button, .btn { font: inherit; padding: 8px 16px; background: #fff; color: #1a1a1a; border: 1px solid #595959; border-radius: 4px; }
      a { color: #0645ad; }
      .good:focus-visible { outline: 2px solid #005fcc; outline-offset: 2px; }
      #offset:focus-visible { outline: 2px solid #c8c8c8; outline-offset: 2px; }
      #flush { background: #eee; border: 0; }
      #flush:focus-visible { outline: 2px solid #c8c8c8; outline-offset: 0; }
    </style>
  </head>
  <body>
    <p class="row"><button id="offset">Save</button></p>
    <p class="row"><button id="flush">Cancel</button></p>
  </body>
</html>
