<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>focus-indicator: focus-trap</title>
    <style>
      body { margin: 32px; font: 16px/1.5 Arial, Helvetica, sans-serif; background: #fff; color: #1a1a1a; }
      .row { margin: 0 0 48px; }
      button, .btn { font: inherit; padding: 8px 16px; background: #fff; color: #1a1a1a; border: 1px solid #595959; border-radius: 4px; }
      a { color: #0645ad; }
      .good:focus-visible { outline: 2px solid #005fcc; outline-offset: 2px; }
      #after:focus { outline: none; }
    </style>
  </head>
  <body>
    <p class="row"><button id="before" class="good">Before</button></p>
    <div id="trap" class="row">
      <button id="t1" class="good">Trap one</button>
      <button id="t2" class="good">Trap two</button>
    </div>
    <p class="row"><button id="after">After</button></p>
    <script>
      const first = document.getElementById('t1');
      const last = document.getElementById('t2');
      document.getElementById('trap').addEventListener('keydown', (event) => {
        if (event.key !== 'Tab') return;
        if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        } else if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        }
      });
    </script>
  </body>
</html>
