<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>focus-indicator: near-threshold-outline</title>
    <style>
      body { margin: 32px; font: 16px/1.5 Arial, Helvetica, sans-serif; background: #fff; color: #1a1a1a; }
      .row { margin: 0 0 48px; }
      button, .btn { font: inherit; padding: 8px 16px; background: #fff; color: #1a1a1a; border: 1px solid #595959; border-radius: 4px; }
      a { color: #0645ad; }
      .good:focus-visible { outline: 2px solid #005fcc; outline-offset: 2px; }
      #near:focus-visible { outline: 2px solid #999; outline-offset: 2px; }
      #just-over:focus-visible { outline: 2px solid #949494; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <p class="row"><button id="near">Save</button></p>
    <p class="row"><button id="just-over">Cancel</button></p>
  </body>
</html>
