<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>focus-indicator: covered-after-scroll</title>
    <style>
      body { margin: 32px; font: 16px/1.5 Arial, Helvetica, sans-serif; background: #fff; color: #1a1a1a; }
      .row { margin: 0 0 48px; }
      button, .btn { font: inherit; padding: 8px 16px; background: #fff; color: #1a1a1a; border: 1px solid #595959; border-radius: 4px; }
      a { color: #0645ad; }
      .good:focus-visible { outline: 2px solid #005fcc; outline-offset: 2px; }
      body { margin: 0; }
      .lead { height: 600px; }
      .spacer { height: 2000px; }
      #panel { position: fixed; top: 25%; bottom: 25%; left: 0; right: 0; background: #fff; border: 1px solid #595959; }
    </style>
  </head>
  <body>
    <div class="lead"></div>
    <button id="a" class="good">Below the panel</button>
    <div class="spacer"></div>
    <div id="panel">Fixed panel</div>
  </body>
</html>
