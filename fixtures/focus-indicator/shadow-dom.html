<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>focus-indicator: shadow-dom</title>
    <style>
      body { margin: 32px; font: 16px/1.5 Arial, Helvetica, sans-serif; background: #fff; color: #1a1a1a; }
      .row { margin: 0 0 48px; }
      button, .btn { font: inherit; padding: 8px 16px; background: #fff; color: #1a1a1a; border: 1px solid #595959; border-radius: 4px; }
      a { color: #0645ad; }
      .good:focus-visible { outline: 2px solid #005fcc; outline-offset: 2px; }
      
    </style>
  </head>
  <body>
    <p class="row"><button id="light" class="good">Light DOM</button></p>
    <x-widget id="host"></x-widget>
    <script>
      const root = document.getElementById('host').attachShadow({ mode: 'open' });
      root.innerHTML = `
        <style>
          button { font: inherit; padding: 8px 16px; margin: 0 48px 48px 0; background: #fff; color: #1a1a1a; border: 1px solid #595959; border-radius: 4px; }
          #good:focus-visible { outline: 2px solid #005fcc; outline-offset: 2px; }
          #bad:focus { outline: none; }
        </style>
        <button id="good">Shadow good</button>
        <button id="bad">Shadow bad</button>`;
    </script>
  </body>
</html>
