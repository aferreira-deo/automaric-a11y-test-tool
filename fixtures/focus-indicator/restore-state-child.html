<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>focus-indicator: restore-state (child document)</title>
    <style>
      body { margin: 32px; font: 16px/1.5 Arial, Helvetica, sans-serif; background: #fff; color: #1a1a1a; }
      .row { margin: 0 0 48px; }
      button, .btn { font: inherit; padding: 8px 16px; background: #fff; color: #1a1a1a; border: 1px solid #595959; border-radius: 4px; }
      a { color: #0645ad; }
      .good:focus-visible { outline: 2px solid #005fcc; outline-offset: 2px; }
      .gap { height: 300px; }
      input { font: inherit; padding: 6px 8px; border: 1px solid #595959; }
    </style>
  </head>
  <body>
    <div class="gap"></div>
    <button id="in-frame" class="good">In the frame</button>
    <input id="frame-field" class="good" type="text" aria-label="Field in the frame" />
    <div class="gap"></div>
  </body>
</html>
