<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>focus-indicator: opaque-frame-long</title>
    <style>
      body { margin: 32px; font: 16px/1.5 Arial, Helvetica, sans-serif; background: #fff; color: #1a1a1a; }
      .row { margin: 0 0 48px; }
      button, .btn { font: inherit; padding: 8px 16px; background: #fff; color: #1a1a1a; border: 1px solid #595959; border-radius: 4px; }
      a { color: #0645ad; }
      .good:focus-visible { outline: 2px solid #005fcc; outline-offset: 2px; }
      iframe { border: 1px solid #595959; }
      #after:focus { outline: none; }
    </style>
  </head>
  <body>
    <p class="row"><button id="before" class="good">Before the frame</button></p>
    <iframe id="frame" sandbox src="opaque-frame-long-child.html" title="Cross-origin document" width="480" height="120"></iframe>
    <p class="row"><button id="after">After the frame, no indicator</button></p>
  </body>
</html>
