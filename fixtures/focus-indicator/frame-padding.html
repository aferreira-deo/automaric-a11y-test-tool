<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>focus-indicator: frame-padding</title>
    <style>
      body { margin: 32px; font: 16px/1.5 Arial, Helvetica, sans-serif; background: #fff; color: #1a1a1a; }
      .row { margin: 0 0 48px; }
      button { font: inherit; padding: 8px 16px; background: #fff; color: #1a1a1a; border: 1px solid #595959; border-radius: 4px; }
      .ring:focus-visible { outline: 2px solid #595959; outline-offset: 2px; }
      .none:focus { outline: none; }
      iframe { display: block; margin: 0 0 24px; }
      #padded { padding: 40px; border: 4px solid #595959; }
      #scaled { border: 0; transform: scale(0.75); transform-origin: 0 0; }
    </style>
  </head>
  <body>
    <iframe id="padded" src="frame-padding-child.html" title="Padded" width="300" height="160"></iframe>
    <iframe id="scaled" src="frame-padding-child.html" title="Scaled" width="300" height="160"></iframe>
  </body>
</html>
