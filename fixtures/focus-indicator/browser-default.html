<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>focus-indicator: browser-default</title>
    <style>
      body { margin: 32px; font: 16px/1.5 Arial, Helvetica, sans-serif; background: #fff; color: #1a1a1a; }
      .row { margin: 0 0 48px; }
      button, .btn { font: inherit; padding: 8px 16px; background: #fff; color: #1a1a1a; border: 1px solid #595959; border-radius: 4px; }
      a { color: #0645ad; }
      .good:focus-visible { outline: 2px solid #005fcc; outline-offset: 2px; }
      input { font: inherit; }
      #styled-button { background: #005fcc; color: #fff; border: 0; }
    </style>
  </head>
  <body>
    <p class="row"><button id="default-button">Save</button></p>
    <p class="row"><a id="default-link" href="#">Read more</a></p>
    <p class="row"><label for="default-input">Name</label> <input id="default-input" type="text" /></p>
    <p class="row"><button id="styled-button">Styled, focus untouched</button></p>
  </body>
</html>
