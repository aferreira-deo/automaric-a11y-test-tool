<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>focus-indicator: spoofed-environment</title>
    <style>
      body { margin: 32px; font: 16px/1.5 Arial, Helvetica, sans-serif; background: #fff; color: #1a1a1a; }
      .row { margin: 0 0 48px; }
      button, .btn { font: inherit; padding: 8px 16px; background: #fff; color: #1a1a1a; border: 1px solid #595959; border-radius: 4px; }
      a { color: #0645ad; }
      .good:focus-visible { outline: 2px solid #005fcc; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <script>
      Object.defineProperty(window, 'innerWidth', { get: () => '<img src=x onerror=alert(1)>' });
      Object.defineProperty(window, 'innerHeight', { get: () => ({ toString: () => '<script>alert(2)<\/script>' }) });
      Object.defineProperty(window, 'devicePixelRatio', { get: () => 7 });
    </script>
    <p class="row"><button id="a" class="good">Save</button></p>
  </body>
</html>
