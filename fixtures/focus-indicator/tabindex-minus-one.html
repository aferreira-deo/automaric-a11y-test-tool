<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>focus-indicator: tabindex-minus-one</title>
    <style>
      body { margin: 32px; font: 16px/1.5 Arial, Helvetica, sans-serif; background: #fff; color: #1a1a1a; }
      .row { margin: 0 0 48px; }
      button, .btn { font: inherit; padding: 8px 16px; background: #fff; color: #1a1a1a; border: 1px solid #595959; border-radius: 4px; }
      a { color: #0645ad; }
      .good:focus-visible { outline: 2px solid #005fcc; outline-offset: 2px; }
      #panel { padding: 16px; border: 1px solid #595959; outline: none; }
    </style>
  </head>
  <body>
    <p class="row"><button id="ok" class="good">In the Tab order</button></p>
    <div id="panel" class="row" tabindex="-1">Panel that receives focus from a script</div>
    <h2 id="heading" tabindex="-1">Heading that receives focus from a script</h2>
  </body>
</html>
