<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>focus-indicator: gradient-background</title>
    <style>
      body { margin: 32px; font: 16px/1.5 Arial, Helvetica, sans-serif; background: #fff; color: #1a1a1a; }
      .row { margin: 0 0 48px; }
      button, .btn { font: inherit; padding: 8px 16px; background: #fff; color: #1a1a1a; border: 1px solid #595959; border-radius: 4px; }
      a { color: #0645ad; }
      .good:focus-visible { outline: 2px solid #005fcc; outline-offset: 2px; }
      .band { padding: 32px; background: linear-gradient(90deg, #ffffff, #cfe8ff); }
      #good:focus-visible { outline: 2px solid #003a70; outline-offset: 2px; }
      #bad:focus-visible { outline: 2px solid #d9e6f2; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div class="band">
      <p class="row"><button id="good">Save this document</button></p>
      <p><button id="bad">Cancel and go back</button></p>
    </div>
  </body>
</html>
