<!doctype html><html lang="en" dir="ltr"><head><!-- A short sign-in page under an open modal cookie dialog that locks body; the dialog has max-height: 90vh and overflow: auto. --><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>reflow: modal-short-page</title><style>*,*::before,*::after{box-sizing:border-box} body{margin:0;font:16px/1.5 Arial,Helvetica,sans-serif;color:#1a1a1a;background:#fff} main{padding:16px;max-width:960px} body.locked{overflow:hidden} .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5)} .dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;padding:16px;width:min(90vw,420px);max-height:90vh;overflow:auto}</style></head><body><main><h1>Sign in</h1><p>Use your account of the council to see your permits and pay your taxes.</p><p><label>Email <input></label></p><p><label>Password <input type="password"></label></p><button>Sign in</button><p>New here? <a href="#">Create an account</a>. Forgot your password? <a href="#">Reset it</a>.</p></main>
   <div class="backdrop"></div><div class="dlg" role="dialog" aria-modal="true" aria-label="Cookies"><p>We use cookies to measure how the site is used.</p><button>Accept</button> <button>Refuse</button></div>
   <script>document.body.classList.add('locked')</script></body></html>
