<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shadow trees and frames</title>
<style>
  body { font: 16px/1.5 Arial, Helvetica, sans-serif; margin: 24px; color: #1a1a1a; background: #fff; }
  iframe { width: 600px; height: 160px; border: 1px solid #595959; display: block; margin-top: 16px; }
  fancy-subscribe, role-button { display: inline-block; padding: 6px 12px; border: 1px solid #595959; cursor: pointer; margin: 4px; }
</style>
</head>
<body>
<main>
  <h1>Shadow trees and frames</h1>
  <nrv-toolbar id="toolbar"></nrv-toolbar>
  <fancy-subscribe tabindex="0" id="fancy"></fancy-subscribe>
  <role-button tabindex="0" id="internals"></role-button>
  <iframe src="shadow-and-iframe-child.html" title="Basket" id="frame"></iframe>
</main>
<script>
  customElements.define('nrv-toolbar', class extends HTMLElement {
    constructor() {
      super();
      const root = this.attachShadow({ mode: 'open' });
      root.innerHTML =
        '<style>button{font:inherit;padding:6px 12px;border:1px solid #595959;background:#fff;margin:4px}</style>' +
        '<button type="button" id="bold">Bold</button>' +
        '<button type="button" id="italic"><svg width="16" height="16"><path d="M6 2h6M4 14h6M10 2L6 14" stroke="#1a1a1a" stroke-width="2"/></svg></button>';
    }
  });
  // A custom element that listens to clicks, takes focus and says nothing of what it is.
  customElements.define('fancy-subscribe', class extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: 'open' }).innerHTML = '<span>Subscribe</span>';
      this.addEventListener('click', () => { this.shadowRoot.querySelector('span').textContent = 'Subscribed'; });
    }
  });
  // The same, with its role given through ElementInternals: exposed as a button.
  customElements.define('role-button', class extends HTMLElement {
    constructor() {
      super();
      this.internals = this.attachInternals();
      this.internals.role = 'button';
      this.attachShadow({ mode: 'open' }).innerHTML = '<span>Like</span>';
      this.addEventListener('click', () => {});
    }
  });
</script>
</body>
</html>
