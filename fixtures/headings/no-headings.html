<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>headings: no-headings</title>
    <style>
      body { margin: 32px; font: 16px/1.5 Arial, Helvetica, sans-serif; background: #fff; color: #1a1a1a; }
      main { max-width: 640px; }
      p { margin: 0 0 16px; }
      .address { font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <p>A page of plain text, with no heading of any kind and nothing that looks like one.</p>
      <p>Some words are <strong>bold</strong>, some are <em>emphasised</em>, and one is <span style="font-size: 24px">large</span>, all inside their sentence.</p>
      <p>Lines of one paragraph<br />separated by line breaks<br />stay one block of text.</p>
      <p class="address">12 Harbour Road<br />Portside<br />PS1 2AB</p>
      <p>A last paragraph.</p>
    </main>
  </body>
</html>
