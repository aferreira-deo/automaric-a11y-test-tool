<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Child document</title>
    <style>
      body { margin: 16px; font: 16px/1.5 Arial, Helvetica, sans-serif; background: #fff; color: #1a1a1a; }
      label { display: block; margin: 4px 0; }
      .q { margin: 0 0 8px; }
      div, fieldset { margin: 0 0 16px; }
    </style>
  </head>
  <body>
    <div id="set"><p class="q">Frame question?</p><label><input type="radio" name="s" /> Yes</label><label><input type="radio" name="s" /> No</label></div>
    <fieldset id="grouped"><legend>Grouped in the frame</legend><label><input type="radio" name="g" /> Yes</label><label><input type="radio" name="g" /> No</label></fieldset>
  </body>
</html>
